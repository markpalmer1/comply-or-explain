name: compliance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "infra/**"
      - "exceptions/**"
      - "controls.yaml"
      - "evaluate.py"
      - ".github/workflows/compliance.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  compliance:
    name: compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Scan infrastructure (Checkov)
        # --soft-fail: Checkov finds problems, evaluate.py decides what blocks
        run: checkov -d infra --framework terraform -o json --soft-fail > checkov.json

      - name: Evaluate controls and exceptions
        id: evaluate
        run: |
          set +e
          python evaluate.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: always() && hashFiles('comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- comply-or-explain -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence-${{ github.run_id }}
          path: |
            evidence.json
            checkov.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Enforce
        if: steps.evaluate.outputs.exit_code != '0'
        run: |
          echo "::error::Compliance check failed: fix the failing controls or raise an exception (see PR comment)."
          exit 1
